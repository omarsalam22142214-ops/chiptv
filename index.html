<!DOCTYPE html>
<html lang="ar" dir="rtl">
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Stream - Advanced Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #151b2b;
            --bg-hover: #1e263c;
            --accent: #00d2ff;
            --accent-hover: #00a3cc;
            --text-main: #f0f4f8;
            --text-muted: #8b9eb0;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 20px;
        }

        /* لوحة التحكم */
        .controls-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }

        .controls-panel input {
            flex: 1; min-width: 140px; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.2);
            color: white; outline: none; transition: 0.3s;
        }

        .controls-panel input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); }

        .action-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

        .btn {
            padding: 12px 18px; border: none; border-radius: 8px; color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            font-size: 14px; display: flex; align-items: center; gap: 6px;
        }

        .btn:active { transform: scale(0.96); }
        .btn-add { background: var(--accent); color: #000; }
        .btn-add:hover { background: var(--accent-hover); }
        .btn-upload { background: var(--success); color: #000;}
        .btn-upload:hover { background: #26b361; }
        .btn-export { background: var(--warning); color: #000;}
        .btn-export:hover { background: #e09200; }
        .btn-clear { background: var(--danger); }
        .btn-clear:hover { background: #e03e4d; }
        
        /* أزرار الإضافات (رابط، اكستريم، ستالكر) */
        .btn-link { background: #3498db; color: #fff; }
        .btn-link:hover { background: #2980b9; }
        .btn-xtream { background: #9b59b6; color: #fff; }
        .btn-xtream:hover { background: #8e44ad; }
        .btn-stalker { background: #e67e22; color: #fff; }
        .btn-stalker:hover { background: #d35400; }
        
        #xtream-panel, #link-panel, #stalker-panel {
            display: none; 
            margin-top: -10px; 
            background: rgba(30, 38, 60, 0.7); 
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* منطقة المشغل والقائمة */
        .content-area { display: flex; gap: 20px; height: calc(100vh - 160px); min-height: 500px; }

        /* القائمة الجانبية */
        .sidebar {
            flex: 1; background: var(--bg-panel); border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); max-width: 350px;
        }

        .sidebar-header {
            padding: 18px; background: rgba(0, 0, 0, 0.2); font-size: 18px;
            font-weight: bold; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            font-size: 12px; background: var(--accent); color: #000;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
        }

        /* تنسيق شريط البحث */
        .search-box {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        .channel-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .channel-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s; cursor: pointer;
        }

        .channel-item:hover { background: var(--bg-hover); }
        .channel-item.playing { background: rgba(0, 210, 255, 0.1); border-right: 4px solid var(--accent); }

        .channel-info { display: flex; align-items: center; flex: 1; overflow: hidden; }
        .channel-thumb { width: 45px; height: 45px; border-radius: 8px; margin-left: 12px; object-fit: cover; background: #000; }
        .channel-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }

        .btn-delete { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-delete:hover { color: var(--danger); transform: scale(1.1); }

        /* منطقة الفيديو */
        .video-container {
            flex: 2.5; background: var(--bg-panel); border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .now-playing-title { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .player-actions { display: flex; gap: 10px; }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1); border: none; color: white;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.2); }

        .player-wrapper {
            flex: 1; border-radius: 12px; overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .plyr { width: 100%; height: 100%; --plyr-color-main: var(--accent); }

        @media (max-width: 992px) {
            .content-area { flex-direction: column-reverse; height: auto; }
            .sidebar { max-width: 100%; height: 400px; }
            .controls-panel { flex-direction: column; align-items: stretch; }
            .action-btns { justify-content: space-between; }
        }
    </style>

    <div class="app-wrapper">
        <div class="controls-panel">
            <div class="input-group">
                <input type="text" id="i-name" placeholder="اسم القناة" data-ddg-inputtype="unknown">
                <input type="text" id="i-url" placeholder="رابط البث (m3u8/ts)" data-ddg-inputtype="unknown">
                <input type="text" id="i-logo" placeholder="رابط اللوجو (اختياري)" data-ddg-inputtype="unknown">
                <button class="btn btn-add" onclick="addChannel()">➕ إضافة</button>
            </div>
            
            <div class="action-btns">
                <button class="btn btn-stalker" onclick="toggleStalkerPanel()">🎮 حساب ستالكر</button>
                <button class="btn btn-link" onclick="toggleLinkPanel()">🌐 استيراد من رابط</button>
                <button class="btn btn-xtream" onclick="toggleXtreamPanel()">📡 حساب اكستريم</button>
                <input type="file" id="file-upload" accept=".m3u,.m3u8,.txt" style="display: none;" onchange="importM3U(event)" multiple="">
                <button class="btn btn-upload" onclick="document.getElementById('file-upload').click()">📁 استيراد</button>
                <button class="btn btn-export" onclick="exportHTML()">💾 تصدير HTML</button>
                <button class="btn btn-clear" onclick="clearAll()">🗑 مسح الكل</button>
            </div>
        </div>

        <!-- لوحة ادخال بيانات الاستيراد من رابط -->
        <div class="controls-panel" id="link-panel" style="display: none;">
            <div class="input-group">
                <input type="text" id="l-url" placeholder="رابط قائمة القنوات أو قناة واحدة (M3U / M3U8)" data-ddg-inputtype="unknown">
                <button class="btn btn-upload" id="btn-fetch-link" onclick="fetchFromLink()">📥 جلب القائمة</button>
            </div>
        </div>

        <!-- لوحة ادخال بيانات الاكستريم -->
        <div class="controls-panel" id="xtream-panel" style="display: none;">
            <div class="input-group">
                <input type="text" id="x-host" placeholder="الهوست (مثال: http://domain.com)" data-ddg-inputtype="unknown">
                <input type="text" id="x-port" placeholder="البورت (مثال: 8080)" data-ddg-inputtype="unknown">
                <input type="text" id="x-user" placeholder="اليوزر (Username)" data-ddg-inputtype="credentials.username">
                <input type="password" id="x-pass" placeholder="الباسورد (Password)" data-ddg-inputtype="credentials.password.new">
                <button class="btn btn-add" id="btn-fetch-xtream" onclick="fetchXtream()">📥 جلب القنوات</button>
            </div>
        </div>

        <!-- لوحة ادخال بيانات ستالكر -->
        <div class="controls-panel" id="stalker-panel" style="display: none;">
            <div class="input-group">
                <input type="text" id="s-url" placeholder="رابط البورتال (مثال: http://portal.com/c)" data-ddg-inputtype="unknown">
                <input type="text" id="s-mac" placeholder="الماك أدرس (مثال: 00:1A:79:xx:xx:xx)" data-ddg-inputtype="unknown">
                <button class="btn btn-add" id="btn-fetch-stalker" onclick="fetchStalker()">📥 جلب قنوات ستالكر</button>
            </div>
        </div>

        <div class="content-area">
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>القنوات</span>
                    <span class="badge" id="ch-count">0</span>
                </div>
                
                <div class="search-box">
                    <input type="text" id="i-search" placeholder="🔍 إبحث عن قناة..." oninput="filterChannels()" data-ddg-inputtype="unknown">
                </div>

                <ul class="channel-list" id="ch-list"></ul>
            </div>

            <div class="video-container">
                <div class="video-header">
                    <div class="now-playing-title" id="np-title">
                        📺 <span>لم يتم اختيار قناة</span>
                    </div>
                    <div class="player-actions">
                        <button class="btn-icon" onclick="reloadStream()" title="تحديث البث">🔄</button>
                        <button class="btn-icon" onclick="stopStream()" title="إيقاف">🛑</button>
                    </div>
                </div>

                <div class="player-wrapper" id="player-wrapper"><video id="video-player" controls="" playsinline="" preload="auto"></video></div>
            </div>
        </div>
    </div>

    <script>
        const domList = document.getElementById('ch-list');
        const domCount = document.getElementById('ch-count');
        const domTitle = document.querySelector('#np-title span');
        const iName = document.getElementById('i-name');
        const iUrl = document.getElementById('i-url');
        const iLogo = document.getElementById('i-logo');
        
        let plyrInstance;
        let hlsInstance;
        let currentUrl = '';
        let currentName = '';

            const lines = content.split('\n');

            let temp = {};

            for (let line of lines) {

                if (line.startsWith('#EXTINF:')) {

                    result.push(temp);
                    temp = {};

            }
            return result;

        async function play(url, name, element) {
            currentUrl = url;
            currentName = name;
            domTitle.innerText = "⏳ جاري الاتصال بالبث...";
            
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
            if (element) element.parentElement.classList.add('playing');

            let streamUrl = url;

            // لو القناة ستالكر ومحتاجة توليد رابط (Create Link)
            if (streamUrl.includes('action=create_link')) {
                try {
                    let res;
                    try {
                        res = await fetch(streamUrl);
                    } catch(e) {
                        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(streamUrl);
                        res = await fetch(proxyUrl);
                    }
                    
                    const data = await res.json();
                    if (data && data.js && data.js.cmd) {
                        streamUrl = data.js.cmd.split(' ').pop(); 
                    } else {
                        throw new Error("لا يمكن توليد الرابط");
                    }
                } catch(e) {
                    console.error("Stalker create_link error:", e);
                    domTitle.innerText = "❌ فشل توليد رابط ستالكر";
                    return;
                }
            }

            if (streamUrl.includes('.ts')) {
                streamUrl = streamUrl.replace('.ts', '.m3u8');
            } else if (!streamUrl.includes('.m3u8') && !streamUrl.includes('action=create_link')) {
                streamUrl += ".m3u8";
            }

            domTitle.innerText = name;
            const videoElement = document.getElementById('video-player');

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 3,
                });
                
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoElement);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    const playPromise = videoElement.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(e => console.log("تنبيه التشغيل:", e));
                    }
                });

                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                domTitle.innerText = "❌ البث متوقف حالياً";
                                break;
                        }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                videoElement.play();
            }
        }

        function reloadStream() {
            if (currentUrl) {
                const playingEl = document.querySelector('.channel-item.playing .channel-info');
                play(currentUrl, currentName, playingEl);
            }
        }

        function stopStream() {
            if (hlsInstance) hlsInstance.destroy();
            const videoElement = document.getElementById('video-player');
            videoElement.pause();
            videoElement.removeAttribute('src');
            videoElement.load();
            domTitle.innerText = "لم يتم اختيار قناة";
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
            currentUrl = '';
        }

        function addChannel() {
            const name = iName.value.trim();
            const url = iUrl.value.trim();
            const logo = iLogo.value.trim();

            if (!name || !url) {
                alert("يجب إدخال الاسم والرابط!");
                return;
            }

            channels.unshift({ name, url, logo });
            render();

            iName.value = ''; iUrl.value = ''; iLogo.value = '';
        }

        /* دوال الاستيراد من رابط */
        function toggleLinkPanel() {
            const panel = document.getElementById('link-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function fetchFromLink() {
            const urlInput = document.getElementById('l-url').value.trim();
            const btn = document.getElementById('btn-fetch-link');

            if (!urlInput) {
                alert("لازم تدخل رابط القائمة أو القناة!");
                return;
            }

            btn.innerText = "⏳ جاري التحميل...";
            btn.disabled = true;

            // --- محاولة اكتشاف وتحويل رابط الاكستريم تلقائياً ---
            try {
                const urlObj = new URL(urlInput);
                const user = urlObj.searchParams.get('username');
                const pass = urlObj.searchParams.get('password');
                
                // لو الرابط فيه يوزر وباسورد وكلمة get.php، ده بنسبة 99% اكستريم
                if (user && pass && urlInput.includes('get.php')) {
                    console.log("تم اكتشاف رابط اكستريم، جاري التحويل التلقائي واستخراج الـ API...");
                    const baseUrl = urlObj.origin; 
                    const apiUrl = `${baseUrl}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
                    
                    let res;
                    try {
                        res = await fetch(apiUrl);
                    } catch(err) {
                        res = await fetch('https://corsproxy.io/?' + encodeURIComponent(apiUrl));
                    }
                    
                    const data = await res.json();
                    if (data && data.length > 0) {
                        const newChannels = data.map(stream => ({
                            name: stream.name || 'قناة غير معروفة',
                            url: `${baseUrl}/live/${user}/${pass}/${stream.stream_id}.m3u8`,
                            logo: stream.stream_icon || ''
                        }));
                        channels = newChannels.concat(channels);
                        render();
                        alert(`تم التعرف على الرابط كحساب اكستريم! وتم جلب ${newChannels.length} قناة بنجاح في ثواني!`);
                        toggleLinkPanel();
                        document.getElementById('l-url').value = '';
                        btn.innerText = "📥 جلب القائمة";
                        btn.disabled = false;
                        return; // وقف الدالة هنا عشان ميكملش تحميل M3U
                    }
                }
            } catch (e) {
                console.log("ليس رابط اكستريم أو فشل التحويل التلقائي، سيتم المحاولة كملف M3U عادي...");
            }
            // ---------------------------------------------------

            // المحاولة كملف M3U عادي لو مطلعش اكستريم
            try {
                let response;
                try {
                    response = await fetch(urlInput);
                } catch (err) {
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(urlInput);
                    response = await fetch(proxyUrl);
                }

                if (!response || !response.ok) throw new Error('مشكلة في الاتصال بالرابط');
                const content = await response.text();
                
                const newChs = parseM3U(content);
                
                if (newChs.length === 0) {
                    if(urlInput.includes('.m3u8') || urlInput.includes('.ts')) {
                        channels.unshift({ name: 'قناة مستوردة من الرابط', url: urlInput, logo: '' });
                        render();
                        alert("تم إضافة القناة المباشرة بنجاح!");
                        toggleLinkPanel();
                        document.getElementById('l-url').value = '';
                    } else {
                        alert("الرابط مش شغال أو مفيهوش قنوات بصيغة M3U صحيحة!");
                    }
                } else {
                    const combinedChannels = newChs.concat(channels);
                    const uniqueChannels = [];
                    const seenUrls = new Set();
                    
                    for (const ch of combinedChannels) {
                        if (!seenUrls.has(ch.url)) {
                            seenUrls.add(ch.url);
                            uniqueChannels.push(ch);
                        }
                    }

                    channels = uniqueChannels;
                    render();
                    alert(`تم استيراد ${newChs.length} قناة بنجاح من الرابط!`);
                    toggleLinkPanel(); 
                    document.getElementById('l-url').value = '';
                }
            } catch (error) {
                console.error("Fetch link error:", error);
                alert("عذراً، السيرفر حمايته بتمنع سحب القنوات مباشرة (CORS).\n\nهنبدأ نحمل الملف تلقائي دلوقتي على جهازك، ولما ينزل استخدم زرار (استيراد 📁) عشان ترفعه.");
                
                const a = document.createElement('a');
                a.href = urlInput;
                a.target = '_blank';
                a.download = ''; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                toggleLinkPanel();
                document.getElementById('l-url').value = '';
            } finally {
                btn.innerText = "📥 جلب القائمة";
                btn.disabled = false;
            }
        }

        /* دوال الأكستريم */
        function toggleXtreamPanel() {
            const panel = document.getElementById('xtream-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function fetchXtream() {
            const host = document.getElementById('x-host').value.trim();
            const port = document.getElementById('x-port').value.trim();
            const user = document.getElementById('x-user').value.trim();
            const pass = document.getElementById('x-pass').value.trim();
            const btn = document.getElementById('btn-fetch-xtream');

            if (!host || !user || !pass) {
                alert("لازم تدخل الهوست واليوزر والباسورد على الأقل!");
                return;
            }

            let baseUrl = host;
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
            if (!baseUrl.startsWith('http')) baseUrl = 'http://' + baseUrl;
            if (port) baseUrl = `${baseUrl}:${port}`;

            const apiUrl = `${baseUrl}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;

            btn.innerText = "⏳ جاري التحميل...";
            btn.disabled = true;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data || data.length === 0) {
                    alert("مفيش قنوات أو البيانات غلط!");
                } else {
                    const newChannels = data.map(stream => ({
                        name: stream.name || 'قناة غير معروفة',
                        url: `${baseUrl}/live/${user}/${pass}/${stream.stream_id}.m3u8`,
                        logo: stream.stream_icon || ''
                    }));

                    channels = newChannels.concat(channels);
                    render();
                    alert(`تم جلب ${newChannels.length} قناة بنجاح!`);
                    toggleXtreamPanel(); 
                }
            } catch (error) {
                console.error("Xtream fetch error:", error);
                alert("حصلت مشكلة في الاتصال بالسيرفر! خلي بالك لو بتشغل الملف من المتصفح مباشرة، ممكن المتصفح يمنع الاتصال بسبب الـ CORS. يفضل تستخدم إضافة للمتصفح بتفك حظر الـ CORS أو تجرب سيرفر تاني.");
            } finally {
                btn.innerText = "📥 جلب القنوات";
                btn.disabled = false;
            }
        }

        /* دوال ستالكر */
        function toggleStalkerPanel() {
            const panel = document.getElementById('stalker-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function fetchStalker() {
            const portal = document.getElementById('s-url').value.trim();
            const mac = document.getElementById('s-mac').value.trim();
            const btn = document.getElementById('btn-fetch-stalker');

            if (!portal || !mac) {
                alert("لازم تدخل رابط البورتال والماك أدرس!");
                return;
            }

            let baseUrl = portal;
            if (baseUrl.endsWith('/c')) baseUrl = baseUrl.slice(0, -2);
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
            if (!baseUrl.endsWith('/server/load.php')) {
                baseUrl += '/server/load.php';
            }

            btn.innerText = "⏳ جاري التحميل...";
            btn.disabled = true;

            try {
                const targetUrl = `${baseUrl}?type=itv&action=get_all_channels`;
                let response;

                try {
                    response = await fetch(targetUrl, {
                        headers: { 'mac': mac }
                    });
                } catch(e) {
                    console.log("Direct stalker fetch failed, trying proxy...");
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
                    response = await fetch(proxyUrl, {
                        headers: { 'mac': mac }
                    });
                }
                
                const data = await response.json();
                
                if (data && data.js && data.js.data) {
                    const stalkerChannels = data.js.data.map(ch => {
                        let streamUrl = ch.cmd || '';
                        streamUrl = streamUrl.split(' ').pop(); 
                        
                        if(!streamUrl.startsWith('http')) {
                            streamUrl = `${baseUrl}?type=itv&action=create_link&cmd=${encodeURIComponent(ch.cmd)}&mac=${mac}`;
                        }
                        
                        return {
                            name: ch.name || 'قناة ستالكر',
                            url: streamUrl,
                            logo: ch.logo || ''
                        };
                    }).filter(ch => ch.url !== '');

                    channels = stalkerChannels.concat(channels);
                    render();
                    alert(`تم جلب ${stalkerChannels.length} قناة من ستالكر بنجاح!`);
                    toggleStalkerPanel();
                } else {
                    alert("البيانات رجعت فاضية! اتأكد إن الماك شغال والبورتال سليم.");
                }

            } catch (error) {
                console.error("Stalker fetch error:", error);
                alert("لسه في مشكلة في الاتصال! اتأكد إن الإضافة (Allow CORS) لونها برتقالي (شغالة) وجرب تاني.");
            } finally {
                btn.innerText = "📥 جلب قنوات ستالكر";
                btn.disabled = false;
            }
        }

        async function importM3U(e) {
            const files = e.target.files;
            
            if (!files || files.length === 0) return;

            let allNewChannels = [];

            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const newChs = parseM3U(evt.target.result);
                        resolve(newChs);
                    };
                    reader.readAsText(file);
                });
            });

            const results = await Promise.all(readPromises);

            results.forEach(chs => {
                allNewChannels = allNewChannels.concat(chs);
            });

            const combinedChannels = allNewChannels.concat(channels);
            
            const uniqueChannels = [];
            const seenUrls = new Set();
            
            for (const ch of combinedChannels) {
                if (!seenUrls.has(ch.url)) {
                    seenUrls.add(ch.url);
                    uniqueChannels.push(ch);
                }
            }

            channels = uniqueChannels;
            render();
            
            alert(`تم استيراد ومعالجة القنوات بنجاح! الإجمالي دلوقتي ${channels.length} قناة.`);
            e.target.value = ''; 
        }

        function removeCh(idx, e) {
            e.stopPropagation();
            channels.splice(idx, 1);
            render();
        }

        function clearAll() {
            if (channels.length === 0) return;
            if (confirm("هل أنت متأكد من مسح جميع القنوات؟")) {
                channels = [];
                localStorage.removeItem('nova_saved_channels');
                render();
                stopStream();
            }
        }

        function exportHTML() {
            if (channels.length === 0) {
                alert("لا توجد قنوات لتصديرها!");
                return;
            }

            const docClone = document.documentElement.cloneNode(true);

            docClone.querySelector('#ch-list').innerHTML = '';
            docClone.querySelector('#np-title span').innerText = 'لم يتم اختيار قناة';
            docClone.querySelector('#ch-count').innerText = '0';
            
            ['#i-name', '#i-url', '#i-logo', '#i-search', '#x-host', '#x-port', '#x-user', '#x-pass', '#l-url', '#s-url', '#s-mac'].forEach(id => {
                const el = docClone.querySelector(id);
                if(el) el.removeAttribute('value');
            });

            const xtreamPanel = docClone.querySelector('#xtream-panel');
            if(xtreamPanel) xtreamPanel.style.display = 'none';
            const linkPanel = docClone.querySelector('#link-panel');
            if(linkPanel) linkPanel.style.display = 'none';
            const stalkerPanel = docClone.querySelector('#stalker-panel');
            if(stalkerPanel) stalkerPanel.style.display = 'none';

            const wrapper = docClone.querySelector('#player-wrapper');
            wrapper.innerHTML = '<video id="video-player" controls playsinline preload="auto"></video>';

            let htmlString = docClone.outerHTML;
            const jsonStr = JSON.stringify(channels);
            
            htmlString = htmlString.replace(/\/\*\[INJECT_CHANNELS\]\*\/[\s\S]*?\/\*\[\/INJECT_CHANNELS\]\*\//, `/*[INJECT_CHANNELS]*/${jsonStr}/*[/INJECT_CHANNELS]*/`);

            const finalHtml = `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n${htmlString}\n</html>`;

            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Nova_Stream_Player.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        render();

    </script>
