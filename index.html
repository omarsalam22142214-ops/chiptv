<!DOCTYPE html>
<html lang="ar" dir="rtl">
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1300">
    <title> ْ</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    
    <style>
        :is(iframe[src*='ads'], iframe[src*='doubleclick'], .adsbygoogle, [id*='google_ads'], [id*='taboola-'], .taboolaHeight, .taboola-placeholder, #top-ad, [id*='google-one-tap-iframe'], #amp_floatingAdDiv, #ez-content-blocker-container) {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            visibility: hidden !important;
            min-height: 0 !important;
        }
    </style>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #151b2b;
            --bg-hover: #1e263c;
            --accent: #00d2ff;
            --accent-hover: #00a3cc;
            --text-main: #f0f4f8;
            --text-muted: #8b9eb0;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 20px;
        }

        .toggle-panel-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -10px;
            z-index: 10;
        }
        
        .btn-toggle-panel {
            background: var(--bg-panel);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .btn-toggle-panel:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .controls-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }

        .controls-panel input, .controls-panel textarea {
            flex: 1; min-width: 140px; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.2);
            color: white; outline: none; transition: 0.3s; font-family: inherit;
        }

        .controls-panel textarea { resize: vertical; min-height: 100px; width: 100%; }

        .controls-panel input:focus, .controls-panel textarea:focus { 
            border-color: var(--accent); box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); 
        }

        .action-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

        .btn {
            padding: 12px 18px; border: none; border-radius: 8px; color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            font-size: 14px; display: flex; align-items: center; gap: 6px;
        }

        .btn:active { transform: scale(0.96); }
        .btn-add { background: var(--accent); color: #000; }
        .btn-add:hover { background: var(--accent-hover); }
        .btn-upload { background: var(--success); color: #000;}
        .btn-upload:hover { background: #26b361; }
        .btn-export { background: var(--warning); color: #000;}
        .btn-export:hover { background: #e09200; }
        .btn-clear { background: var(--danger); }
        .btn-clear:hover { background: #e03e4d; }
        .btn-save { background: #2ed573; color: #000; }
        .btn-save:hover { background: #26b361; }
        
        .btn-link { background: #3498db; color: #fff; }
        .btn-link:hover { background: #2980b9; }
        .btn-xtream { background: #9b59b6; color: #fff; }
        .btn-xtream:hover { background: #8e44ad; }
        .btn-stalker { background: #e67e22; color: #fff; }
        .btn-stalker:hover { background: #d35400; }
        .btn-quick { background: #f39c12; color: #fff; }
        .btn-quick:hover { background: #e67e22; }
        .btn-scrape { background: #e74c3c; color: #fff; }
        .btn-scrape:hover { background: #c0392b; }
        .btn-bulk { background: #00cec9; color: #000; }
        .btn-bulk:hover { background: #00b8b2; }

        .btn-discover { background: linear-gradient(135deg, #f1c40f, #e67e22); color: #000; }
        .btn-discover:hover { background: linear-gradient(135deg, #e09200, #d35400); }
        
        #xtream-panel, #link-panel, #stalker-panel, #bulk-panel {
            display: none; 
            margin-top: -10px; 
            background: rgba(30, 38, 60, 0.7); 
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            animation: fadeIn 0.3s ease;
            flex-direction: column;
            align-items: stretch;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-area { display: flex; gap: 20px; height: calc(100vh - 160px); min-height: 500px; }

        .sidebar {
            flex: 1; background: var(--bg-panel); border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); max-width: 420px;
        }

        .sidebar-header {
            padding: 18px; background: rgba(0, 0, 0, 0.2); font-size: 18px;
            font-weight: bold; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            font-size: 12px; background: var(--accent); color: #000;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
        }

        .search-box {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .batch-actions {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .main-list-container {
            overflow-y: auto; flex: 1;
        }
        .main-list-container::-webkit-scrollbar { width: 6px; }
        .main-list-container::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .channel-list { list-style: none; padding: 0; margin: 0; }

        .folder-container { border-bottom: 1px solid rgba(255, 255, 255, 0.02); }
        
        .folder-header {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: grab;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent);
            transition: 0.2s;
        }
        .folder-header:active { cursor: grabbing; }
        .folder-header:hover { background: rgba(255, 255, 255, 0.06); }
        .folder-header.active { background: rgba(0, 210, 255, 0.1); }
        .folder-icon { transition: transform 0.3s; }
        .folder-header.active .folder-icon { transform: rotate(90deg); }

        .folder-content { display: none; background: rgba(0, 0, 0, 0.15); min-height: 10px; }
        .folder-content.open { display: block; }

        .channel-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px 10px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.2s; cursor: grab;
        }

        .channel-item:active { cursor: grabbing; }
        .channel-item:hover { background: var(--bg-hover); }
        .channel-item.playing { background: rgba(0, 210, 255, 0.15); border-right: 4px solid var(--accent); }

        .channel-checkbox-wrapper { display: flex; align-items: center; padding-left: 10px; }
        .ch-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

        .channel-info { display: flex; align-items: center; flex: 1; overflow: hidden; pointer-events: auto; }
        .channel-thumb { width: 40px; height: 40px; border-radius: 8px; margin-left: 12px; object-fit: cover; background: #000; }
        .channel-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }

        .channel-actions { display: flex; gap: 5px; align-items: center; }
        
        .btn-delete { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-delete:hover { color: var(--danger); transform: scale(1.1); }
        
        .btn-copy { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-copy:hover { color: var(--success); transform: scale(1.1); }

        .btn-edit { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-edit:hover { color: var(--warning); transform: scale(1.1); }

        .video-container {
            flex: 2.5; background: var(--bg-panel); border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .video-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .now-playing-title { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .player-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;}

        .btn-icon {
            background: rgba(255, 255, 255, 0.1); border: none; color: white;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s;
            font-size: 13px; font-weight: bold;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.2); }

        .player-wrapper {
            flex: 1; border-radius: 12px; overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .plyr { width: 100%; height: 100%; --plyr-color-main: var(--accent); }
        .plyr--video { background: #000 !important; }
        
        #external-controls {
            margin-bottom: 15px;
        }
        #external-controls .plyr__controls {
            position: static !important;
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(255,255,255,0.05) !important;
            border-bottom: 2px solid var(--accent) !important;
            border-radius: 12px !important;
            padding: 10px 15px !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
        }

        .plyr--fullscreen-active .plyr__controls {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            background: linear-gradient(transparent, rgba(0,0,0,0.8)) !important;
            border-radius: 0 !important;
            border: none !important;
        }

        @media (max-width: 992px) {
            .content-area { flex-direction: column-reverse; height: auto; }
            .sidebar { max-width: 100%; height: 400px; }
            .controls-panel { flex-direction: column; align-items: stretch; }
            .action-btns { justify-content: space-between; }
        }

        body.cinema-mode .controls-panel { display: none !important; }
        body.cinema-mode .sidebar { display: none !important; }
        body.cinema-mode .content-area { height: calc(100vh - 40px); }
        body.cinema-mode .video-container { height: 100%; }
        
        .rotated-video {
            transform: rotate(90deg);
            height: 100vw !important;
            width: 100vh !important;
            object-fit: cover;
        }

        /* تنسيق الأشكال أثناء السحب */
        .sortable-ghost {
            opacity: 0.4;
            background: rgba(0, 210, 255, 0.1);
            border: 2px dashed var(--accent);
        }

    </style>
</head>

    <div class="app-wrapper">
        <div class="toggle-panel-wrapper">
            <button id="toggle-panel-btn" class="btn-toggle-panel" onclick="toggleMainPanel()">⚙️ إخفاء لوحة التحكم</button>
        </div>

        <div class="controls-panel" id="main-controls-panel" style="display: flex;">

    <script>
        const domList = document.getElementById('ch-list');
        const domCount = document.getElementById('ch-count');

        const iName = document.getElementById('i-name');
        const iUrl = document.getElementById('i-url');
        const iLogo = document.getElementById('i-logo');
        const iGroup = document.getElementById('i-group');
        
        let plyrInstance;
        let hlsInstance;
        let currentUrl = '';
        let currentName = '';
        let currentChannelIndex = -1;
        let isCinemaMode = false;
        let isRotated = false;
        let autoFlipInterval = null;
        let isAutoFlipActive = false;

        let channels = [];
        let savedItems = [];
        let customFolders = [];

        // يا هندسة، حط قايمة القنوات بتاعتك بالظبط بين القوسين دول []
        // لأن مساحتها أكبر من إني أقدر ابعتها في رد واحد
        const injected = /*[INJECT_CHANNELS]*/[]/*[/INJECT_CHANNELS]*/;
        
        if (injected && injected.length > 0) channels = injected;

        const injectedSaved = /*[INJECT_SAVED]*/[{"name":"wwe","url":"https://dpv6ceilvhyrw.cloudfront.net/playlist.m3u8","type":"video"}]/*[/INJECT_SAVED]*/;
        if (injectedSaved && injectedSaved.length > 0) savedItems = injectedSaved;

        const injectedFolders = /*[INJECT_FOLDERS]*/[]/*[/INJECT_FOLDERS]*/;
        if (injectedFolders && injectedFolders.length > 0) customFolders = injectedFolders;

        function toggleMainPanel() {
            const panel = document.getElementById('main-controls-panel');
            const btn = document.getElementById('toggle-panel-btn');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
                btn.innerHTML = '⚙️ إخفاء لوحة التحكم';
            } else {
                panel.style.display = 'none';
                btn.innerHTML = '⚙️ إظهار لوحة التحكم';
            }
        }

        function initPlayer() {
            const videoElement = document.getElementById('video-player');
            plyrInstance = new Plyr(videoElement, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                ratio: '16:9',
                autoplay: true 
            });

            const controls = document.querySelector('.player-wrapper .plyr__controls');
            const extWrapper = document.getElementById('external-controls');
            if (controls && extWrapper) {
                // ده السطر اللي بيحل مشكلة شريط التحكم المزدوج
                extWrapper.innerHTML = ''; 
                extWrapper.appendChild(controls);
            }

            plyrInstance.on('enterfullscreen', () => {
                const ctrls = document.querySelector('#external-controls .plyr__controls');
                if(ctrls) document.querySelector('.player-wrapper .plyr').appendChild(ctrls);
            });

            plyrInstance.on('exitfullscreen', () => {
                const ctrls = document.querySelector('.player-wrapper .plyr__controls');
                if(ctrls) document.getElementById('external-controls').appendChild(ctrls);
            });
        }
        initPlayer();

        function toggleCustomFullscreen() {
            if (plyrInstance && plyrInstance.fullscreen) {
                plyrInstance.fullscreen.toggle();
            } else {
                const wrapper = document.getElementById('player-wrapper');
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen().catch(err => {});
                } else {
                    document.exitFullscreen();
                }
            }
        }

        function toggleRotation() {
            isRotated = !isRotated;
            const videoEl = document.getElementById('video-player');
            const iframeEl = document.getElementById('website-player');
            const transformValue = isRotated ? 'rotate(90deg)' : 'none';
            
            if (videoEl) videoEl.style.transform = transformValue;
            if (iframeEl) iframeEl.style.transform = transformValue;
        }

        function toggleCinemaMode() {
            isCinemaMode = !isCinemaMode;
            document.body.classList.toggle('cinema-mode', isCinemaMode);
        }

        function toggleAutoFlip() {
            const btn = document.getElementById('auto-flip-btn');
            if (isAutoFlipActive) {
                clearInterval(autoFlipInterval);
                isAutoFlipActive = false;
                btn.style.background = '';
                btn.style.color = '';
                alert("تم إيقاف التقليب التلقائي.");
            } else {
                let secs = prompt("أدخل عدد الثواني للتقليب التلقائي (من 20 إلى 60):", "30");
                if (secs === null) return;
                secs = parseInt(secs);
                if (isNaN(secs) || secs < 20 || secs > 60) {
                    alert("الرجاء إدخال رقم صحيح بين 20 و 60 ثانية يا هندسة!");
                    return;
                }
                isAutoFlipActive = true;
                btn.style.background = 'rgba(46, 213, 115, 0.4)';
                btn.style.color = 'var(--success)';
                alert(`تم تفعيل التقليب التلقائي كل ${secs} ثانية.`);
                
                autoFlipInterval = setInterval(() => {
                    playNext();
                }, secs * 1000);
            }
        }

        function playNext() {
            if (channels.length === 0) return;
            currentChannelIndex = currentChannelIndex === -1 ? 0 : (currentChannelIndex + 1) % channels.length;
            triggerPlayFromList(currentChannelIndex);
        }

        function playPrev() {
            if (channels.length === 0) return;
            currentChannelIndex = currentChannelIndex === -1 ? channels.length - 1 : (currentChannelIndex - 1 + channels.length) % channels.length;
            triggerPlayFromList(currentChannelIndex);
        }

        function triggerPlayFromList(index) {
            const nextCh = channels[index];
            const listItems = document.querySelectorAll('#ch-list .channel-item');
            let targetElement = null;
            if (listItems[index]) {
                targetElement = listItems[index].querySelector('.channel-info');
                const folderContent = listItems[index].closest('.folder-content');
                if (folderContent) { folderContent.classList.add('open'); folderContent.previousElementSibling.classList.add('active'); }
            }
            play(nextCh.url, nextCh.name, targetElement, index);
            if (targetElement) targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toggleBulkPanel() {
            const panel = document.getElementById('bulk-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        function processTextContent(content, filename = '') {
            const upperContent = content.toUpperCase();
            if (upperContent.includes('#EXTINF') || upperContent.includes('#EXTM3U')) return parseM3U(content);
            if (upperContent.includes('<PLAYLIST') || filename.toLowerCase().endsWith('.xspf')) return parseXSPF(content);
            
            let newChs = [];
            const lines = content.split('\n');
            lines.forEach((line, index) => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;
                if (line.includes(',')) {
                    const parts = line.split(',');
                    newChs.push({ 
                        name: parts[0].trim() || `قناة ${index + 1}`, 
                        url: parts[1] ? parts[1].trim() : '', 
                        logo: parts[2] ? parts[2].trim() : '',
                        group: parts[3] ? parts[3].trim() : 'مجلد مخصص'
                    });
                } else if (line.startsWith('http')) {
                    newChs.push({ name: `قناة ${index + 1}`, url: line, logo: '', group: 'قنوات مجمعة' });
                }
            });
            return newChs.filter(ch => ch.url);
        }

        function addBulkChannels() {
            const content = document.getElementById('bulk-input').value.trim();
            if (!content) return alert("الرجاء إدخال النصوص أولاً!");
            let newChs = processTextContent(content);
            if (newChs.length > 0) { 
                mergeChannels(newChs); 
                alert(`تم إضافة ${newChs.length} قناة بنجاح.`); 
                document.getElementById('bulk-input').value = ''; 
                toggleBulkPanel(); 
            } else {
                alert("مقدرناش نتعرف على القنوات! اتأكد من الصيغة.");
            }
        }

        function saveCurrentLink() {
            const url = document.getElementById('i-direct-link').value.trim();
            if(!url) return alert("أدخل رابطاً أولاً!");
            const name = prompt("أدخل اسماً:");
            if(!name) return;
            const isVideo = url.includes('.m3u8') || url.includes('.ts') || url.includes('.mp4');
            savedItems.unshift({ name, url, type: isVideo ? 'video' : 'website' });
            renderSaved();
        }

        function renderSaved() {
            const list = document.getElementById('saved-list');
            const count = document.getElementById('saved-count');
            if(!list || !count) return;
            list.innerHTML = '';
            count.innerText = savedItems.length;
            savedItems.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                const icon = item.type === 'video' ? '▶️' : '🌐';
                li.innerHTML = `
                    <div class="channel-info" onclick="playSaved(${idx})">
                        <span style="font-size:18px; margin-left:10px;">${icon}</span>
                        <span class="channel-name">${item.name}</span>
                    </div>
                    <div class="channel-actions">
                        <button class="btn-icon" style="padding:2px 5px; font-size:12px; background: transparent; color: #3498db; margin: 0;" onclick="playSavedAs(${idx}, 'website', event)" title="تشغيل كموقع">🌐</button>
                        <button class="btn-icon" style="padding:2px 5px; font-size:12px; background: transparent; color: var(--success); margin: 0;" onclick="playSavedAs(${idx}, 'video', event)" title="تشغيل كفيديو">▶️</button>
                        <button class="btn-copy" onclick="copyLink('${item.url}', event)">🔗</button>
                        <button class="btn-delete" onclick="deleteSaved(${idx}, event)">❌</button>
                    </div>`;
                list.appendChild(li);
            });
        }

        function playSaved(idx) {
            const item = savedItems[idx];
            document.getElementById('i-direct-link').value = item.url;
            if(item.type === 'video') playDirectLink(); else playWebsite();
        }

        function playSavedAs(idx, mode, e) {
            e.stopPropagation();
            savedItems[idx].type = mode;
            renderSaved();
            document.getElementById('i-direct-link').value = savedItems[idx].url;
            if(mode === 'video') playDirectLink(); else playWebsite();
        }

        function deleteSaved(idx, e) { e.stopPropagation(); if(confirm("حذف؟")) { savedItems.splice(idx, 1); renderSaved(); } }

        async function scrapeMatch() {
            const matchUrl = prompt("رابط الماتش:");
            if (!matchUrl) return;
            domTitle.innerText = "⏳ جاري السحب...";
            try {
                const response = await fetch(`http://127.0.0.1:5000/get_stream?url=${encodeURIComponent(matchUrl)}`);
                const data = await response.json();
                if (data.success) { mergeChannels([{ name: "ماتش مسحوب", url: data.stream_url, group: 'المباريات' }]); play(data.stream_url, "ماتش مسحوب", null, 0); }
            } catch (e) { alert("تأكد من سيرفر البايثون!"); }
        }

        async function discoverSports() {
            const btn = document.querySelector('.btn-discover');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ جاري البحث...';
            btn.disabled = true;
            try {
                const response = await fetch('https://iptv-org.github.io/iptv/categories/sports.m3u');
                if (!response.ok) throw new Error('Network error');
                const text = await response.text();
                
                let discoveredChannels = [];
                let tempName = 'قناة رياضية غير معروفة';
                const lines = text.split('\n');
                
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        let nameMatch = line.match(/,(.*)$/);
                        tempName = (nameMatch && nameMatch[1]) ? nameMatch[1].trim() : 'قناة رياضية';
                    } else if (line && !line.startsWith('#') && line.startsWith('http')) {
                        discoveredChannels.push({ name: tempName, url: line });
                    }
                }

                if (discoveredChannels.length > 0) {
                    const randomIndex = Math.floor(Math.random() * discoveredChannels.length);
                    const selectedChannel = discoveredChannels[randomIndex];
                    play(selectedChannel.url, "🏆 اكتشاف: " + selectedChannel.name, null, -1);
                } else {
                    throw new Error('No channels found');
                }
            } catch (error) {
                const fallbackChannels = [
                    { name: "AD Sports 1 (أبوظبي الرياضية 1)", url: "https://admdn1.cdn.mangomolo.com/adsports1/smil:adsports1.stream.smil/playlist.m3u8" },
                    { name: "Dubai Sports 1 (دبي الرياضية)", url: "https://dmidx.mangomolo.com/dubaisports/smil:dubaisports.smil/playlist.m3u8" },
                    { name: "Red Bull TV (رياضات اكشن)", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" }
                ];
                const randomIndex = Math.floor(Math.random() * fallbackChannels.length);
                const selectedChannel = fallbackChannels[randomIndex];
                play(selectedChannel.url, "🏆 اكتشاف (بديل): " + selectedChannel.name, null, -1);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            let result = [], temp = {};
            for (let line of lines) {
                line = line.trim();
                if (line.toUpperCase().startsWith('#EXTINF')) {
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    let groupMatch = line.match(/group-title="([^"]+)"/i);
                    let commaIndex = line.lastIndexOf(',');
                    temp.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'قناة';
                    temp.logo = logoMatch ? logoMatch[1] : '';
                    temp.group = groupMatch ? groupMatch[1].trim() : 'قنوات عامة';
                } else if (line && !line.startsWith('#')) {
                    temp.url = line;
                    if (!temp.name) temp.name = `قناة ${result.length + 1}`;
                    if (!temp.group) temp.group = 'قنوات عامة';
                    result.push(temp);
                    temp = {}; 
                }
            }
            return result;
        }

        function parseXSPF(content) {
            let result = [];
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(content, "text/xml");
                const tracks = xmlDoc.getElementsByTagName("track");
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    const name = track.getElementsByTagName("title")[0]?.textContent || 'قناة';
                    const url = track.getElementsByTagName("location")[0]?.textContent || '';
                    if (url) result.push({ name, url, group: 'قنوات عامة' });
                }
            } catch (e) {}
            return result;
        }

        function mergeChannels(newChs) {
            const combined = newChs.concat(channels);
            const unique = []; const seen = new Set();
            for (const ch of combined) { if (!seen.has(ch.url)) { seen.add(ch.url); unique.push(ch); } }
            channels = unique; render();
        }

                    const name = item.querySelector('.channel-name').innerText.toLowerCase();
                    if (name.includes(query)) { item.style.display = 'flex'; hasMatch = true; } else { item.style.display = 'none'; }

            });
        }

            const urlInput = document.getElementById('l-url').value.trim();

                const pass = urlObj.searchParams.get('password');
                
                if (user && pass && (testUrl.includes('get.php') || testUrl.includes('player_api.php'))) {
                    const baseUrl = urlObj.origin; 
                    const catApi = `${baseUrl}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_categories`;

                    await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl), { headers: { 'mac': mac } })
                );
                const data = await response.json();
                
                if (data && data.js && data.js.data) {
                    const stalkerChannels = data.js.data.map(ch => {
                        let streamUrl = ch.cmd ? ch.cmd.split(' ').pop() : '';
                        if(!streamUrl.startsWith('http')) streamUrl = `${baseUrl}?type=itv&action=create_link&cmd=${encodeURIComponent(ch.cmd)}&mac=${mac}`;
                        return { name: ch.name || 'قناة', url: streamUrl, logo: ch.logo || '', group: 'قنوات ستالكر' };
                    }).filter(ch => ch.url !== '');
                    mergeChannels(stalkerChannels);
                    alert(`تم جلب ${stalkerChannels.length} قناة!`);
                    toggleStalkerPanel();
                } else alert("البيانات فارغة! تأكد من الماك.");
            } catch (error) { alert("مشكلة في الاتصال (CORS)."); } 
            finally { btn.innerText = "📥 جلب ستالكر"; btn.disabled = false; }
        }

        async function importM3U(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            let allNewChannels = [];
            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const content = evt.target.result;
                        resolve(processTextContent(content, file.name));
                    };
                    reader.readAsText(file);
                });
            });
            const results = await Promise.all(readPromises);
            results.forEach(chs => allNewChannels = allNewChannels.concat(chs));
            
            if (allNewChannels.length > 0) {
                mergeChannels(allNewChannels);
                alert(`تم رفع القنوات! الإجمالي دلوقتي ${channels.length} قناة.`);
            } else {
                alert("الملف ده مفيش فيه قنوات بتنسيق صحيح!");
            }
            e.target.value = ''; 
        }

        function exportM3U() {
            if (channels.length === 0 && savedItems.length === 0) return alert("مفيش قنوات أو محفوظات لتصديرها!");
            let m3uContent = "#EXTM3U\n";
            
            if (channels.length > 0) {
                channels.forEach(ch => {
                    let logoAttr = ch.logo ? ` tvg-logo="${ch.logo}"` : "";
                    let groupAttr = ch.group ? ` group-title="${ch.group}"` : "";
                    m3uContent += `#EXTINF:-1${logoAttr}${groupAttr},${ch.name}\n${ch.url}\n`;
                });
            }
            
            if (savedItems.length > 0) {
                savedItems.forEach(item => {
                    let typeSuffix = item.type === 'website' ? ' (موقع)' : '';
                    m3uContent += `#EXTINF:-1 group-title="المحفوظات",${item.name}${typeSuffix}\n${item.url}\n`;
                });
            }

            const blob = new Blob([m3uContent], { type: 'application/vnd.apple.mpegurl;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Nova_Stream_All.m3u8';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function exportHTML() {
            if (channels.length === 0 && savedItems.length === 0 && customFolders.length === 0) return alert("لا توجد بيانات لتصديرها!");
            const docClone = document.documentElement.cloneNode(true);
            docClone.querySelector('#ch-list').innerHTML = '';
            docClone.querySelector('#saved-list').innerHTML = '';
            docClone.querySelector('#np-title span').innerText = 'لم يتم اختيار قناة';
            docClone.querySelector('#ch-count').innerText = '0';
            docClone.querySelector('#saved-count').innerText = '0';
            
            const mainPanel = docClone.querySelector('#main-controls-panel');
            if (mainPanel) mainPanel.style.display = 'flex';
            const toggleBtn = docClone.querySelector('#toggle-panel-btn');
            if (toggleBtn) toggleBtn.innerHTML = '⚙️ إخفاء لوحة التحكم';

            const extControls = docClone.querySelector('#external-controls');
            if (extControls) extControls.innerHTML = '';

            const autoFlipBtnExport = docClone.querySelector('#auto-flip-btn');
            if (autoFlipBtnExport) { autoFlipBtnExport.style.background = ''; autoFlipBtnExport.style.color = ''; }

            ['#i-name', '#i-url', '#i-logo', '#i-group', '#i-search', '#x-host', '#x-port', '#x-user', '#x-pass', '#l-url', '#s-url', '#s-mac', '#x-quick-link', '#i-direct-link', '#bulk-input'].forEach(id => {
                const el = docClone.querySelector(id);
                if(el) { if (el.tagName === 'TEXTAREA') el.innerHTML = ''; else el.removeAttribute('value'); }
            });

            ['#xtream-panel', '#link-panel', '#stalker-panel', '#bulk-panel'].forEach(id => {
                const panel = docClone.querySelector(id);
                if(panel) panel.style.display = 'none';
            });

            const wrapper = docClone.querySelector('#player-wrapper');
            wrapper.innerHTML = '<iframe id="website-player" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen style="display:none; width:100%; height:100%; border:none; background:#fff; z-index: 10;"></iframe><video id="video-player" autoplay playsinline preload="auto"></video>';

            let htmlString = docClone.outerHTML;
            htmlString = htmlString.replace(/\/\*\[INJECT_CHANNELS\]\*\/[\s\S]*?\/\*\[\/INJECT_CHANNELS\]\*\//, `/*[INJECT_CHANNELS]*/${JSON.stringify(channels)}/*[/INJECT_CHANNELS]*/`);
            htmlString = htmlString.replace(/\/\*\[INJECT_SAVED\]\*\/[\s\S]*?\/\*\[\/INJECT_SAVED\]\*\//, `/*[INJECT_SAVED]*/${JSON.stringify(savedItems)}/*[/INJECT_SAVED]*/`);
            htmlString = htmlString.replace(/\/\*\[INJECT_FOLDERS\]\*\/[\s\S]*?\/\*\[\/INJECT_FOLDERS\]\*\//, `/*[INJECT_FOLDERS]*/${JSON.stringify(customFolders)}/*[/INJECT_FOLDERS]*/`);

            const finalHtml = `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n${htmlString}\n</html>`;
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Nova_Stream_Player.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function setupStreamSelectors() {
            const c = document.getElementById('stream-settings-container');
            const qSel = document.getElementById('quality-selector');
            const aSel = document.getElementById('audio-selector');
            const sSel = document.getElementById('subtitle-selector');
            
            if (!hlsInstance) { c.style.display = 'none'; return; }
            
            let hasOptions = false;

            // Quality
            const levels = hlsInstance.levels;
            qSel.innerHTML = '<option value="-1">تلقائي</option>';
            if (levels && levels.length > 1) {
                hasOptions = true;
                levels.forEach((l, i) => { 
                    if(l.height){ 
                        const o = document.createElement('option'); o.value = i; o.text = l.height+'p'; qSel.appendChild(o); 
                    } 
                });
                qSel.value = hlsInstance.currentLevel;
            }

            // Audio
            const audioTracks = hlsInstance.audioTracks;
            aSel.innerHTML = '';
            if (audioTracks && audioTracks.length > 1) {
                hasOptions = true;
                audioTracks.forEach((t, i) => { 
                    const o = document.createElement('option'); o.value = i; 
                    o.text = t.name || t.language || `صوت ${i+1}`; aSel.appendChild(o); 
                });
                aSel.value = hlsInstance.audioTrack;
            } else {
                aSel.innerHTML = '<option value="-1">الافتراضي</option>';
            }

            // Subtitle
            const subTracks = hlsInstance.subtitleTracks;
            sSel.innerHTML = '<option value="-1">إيقاف</option>';
            if (subTracks && subTracks.length > 0) {
                hasOptions = true;
                subTracks.forEach((t, i) => { 
                    const o = document.createElement('option'); o.value = i; 
                    o.text = t.name || t.language || `ترجمة ${i+1}`; sSel.appendChild(o); 
                });
                sSel.value = hlsInstance.subtitleTrack;
            }

            c.style.display = hasOptions ? 'flex' : 'none';
        }

        window.changeQuality = (i) => { if(hlsInstance) { hlsInstance.currentLevel = parseInt(i); hlsInstance.nextLevel = parseInt(i); } };
        window.changeAudio = (i) => { if(hlsInstance) hlsInstance.audioTrack = parseInt(i); };
        window.changeSubtitle = (i) => { if(hlsInstance) hlsInstance.subtitleTrack = parseInt(i); };

        function playDirectLink() { 
            const u = document.getElementById('i-direct-link').value; 
            if(u) {
                if (currentChannelIndex !== -1 && channels[currentChannelIndex] && channels[currentChannelIndex].url === u) {
                    channels[currentChannelIndex].playbackMode = 'video';
                }
                play(u, currentName || "تشغيل مباشر", null, currentChannelIndex); 
            } 
        }
        
        function playWebsite() { 
            const u = document.getElementById('i-direct-link').value; 
            if(u) { 
                if (currentChannelIndex !== -1 && channels[currentChannelIndex] && channels[currentChannelIndex].url === u) {
                    channels[currentChannelIndex].playbackMode = 'website';
                }
                stopStream(); 
                document.querySelector('.player-wrapper .plyr').style.setProperty('display', 'none', 'important'); 
                document.getElementById('external-controls').style.display = 'none';
                const ifr=document.getElementById('website-player'); 
                ifr.style.display='block'; 
                let safeUrl = u.startsWith('http') ? u : 'https://' + u; 
                ifr.src=safeUrl; 
                domTitle.innerText = currentName || "🌐 عرض موقع"; 
            } 
        }

        function openExternalLink() {
            const u = document.getElementById('i-direct-link').value;
            if (u) {
                let safeUrl = u.startsWith('http') ? u : 'https://' + u;
                window.open(safeUrl, '_blank');
            } else {
                alert("يا هندسة مفيش أي رابط شغال دلوقتي عشان تفتحه!");
            }
        }

        async function play(url, name, el, idx = -1) {
            currentUrl = url; currentName = name; currentChannelIndex = idx;
            document.getElementById('i-direct-link').value = url;

            if (idx !== -1 && channels[idx] && channels[idx].playbackMode === 'website') {
                stopStream(true); 
                document.querySelector('.player-wrapper .plyr').style.setProperty('display', 'none', 'important'); 
                document.getElementById('external-controls').style.display = 'none';
                const ifr=document.getElementById('website-player'); 
                ifr.style.display='block'; 
                let safeUrl = url.startsWith('http') ? url : 'https://' + url; 
                ifr.src=safeUrl; 
                domTitle.innerText = name;
                document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
                if (el) el.parentElement.classList.add('playing');
                return;
            }

            const ifr = document.getElementById('website-player'); ifr.style.display = 'none'; ifr.src = '';
            
            document.querySelector('.player-wrapper .plyr').style.setProperty('display', 'block', 'important');
            document.getElementById('external-controls').style.display = 'block';

            domTitle.innerText = "⏳ جاري الاتصال...";
            document.getElementById('stream-settings-container').style.display = 'none';
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
            if (el) el.parentElement.classList.add('playing');
            const vid = document.getElementById('video-player');
            if (hlsInstance) hlsInstance.destroy();
            
            let streamUrl = url;
            if (streamUrl.includes('action=create_link')) {
                try {
                    let res;
                    try { res = await fetch(streamUrl); } catch(e) { res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(streamUrl)); }
                    const data = await res.json();
                    if (data && data.js && data.js.cmd) streamUrl = data.js.cmd.split(' ').pop(); 
                    else throw new Error("لا يمكن توليد الرابط");
                } catch(e) { domTitle.innerText = "❌ فشل رابط ستالكر"; return; }
            }
            if (streamUrl.endsWith('.ts')) streamUrl = streamUrl.replace(/\.ts(\?.*)?$/, '.m3u8$1');
            
            const isVideoExt = streamUrl.match(/\.(mp4|mkv|webm|ogg|avi|flv|mov)$/i);
            
            if (Hls.isSupported() && !isVideoExt) {
                hlsInstance = new Hls(); hlsInstance.loadSource(streamUrl); hlsInstance.attachMedia(vid);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (e, d) => { 
                    plyrInstance.play(); 
                    setupStreamSelectors(); 
                });
                hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => setupStreamSelectors());
                hlsInstance.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => setupStreamSelectors());
                hlsInstance.on(Hls.Events.LEVEL_SWITCHED, (e, d) => { 
                    const l = hlsInstance.levels[d.level]; 
                    if(l && l.height) {
                        document.getElementById('current-quality').innerText = `📡 الجودة: ${l.height}p`; 
                    } else {
                        document.getElementById('current-quality').innerText = `📡 الجودة: تلقائي`; 
                    }
                    const qSel = document.getElementById('quality-selector');
                    if(qSel) qSel.value = d.level;
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        else { 
                            hlsInstance.destroy(); 
                            vid.src = streamUrl;
                            plyrInstance.play().catch(err => {
                                domTitle.innerText = "❌ البث متوقف أو الرابط غير مدعوم"; 
                                document.getElementById('stream-settings-container').style.display = 'none';
                            });
                        }
                    }
                });
            } else { vid.src = streamUrl; plyrInstance.play(); }
            domTitle.innerText = name;
        }

        function stopStream(isInternal = false) { 
            if (hlsInstance) hlsInstance.destroy(); 
            const v = document.getElementById('video-player'); v.pause(); v.removeAttribute('src'); v.load(); 
            
            const ifr = document.getElementById('website-player'); 
            ifr.src = ''; 
            ifr.style.display = 'none';
            
            document.querySelector('.player-wrapper .plyr').style.setProperty('display', 'block', 'important'); 
            document.getElementById('external-controls').style.display = 'block';

            domTitle.innerText = "لم يتم اختيار قناة"; 
            document.getElementById('stream-settings-container').style.display = 'none'; 
            
            if (!isInternal && isAutoFlipActive) {
                clearInterval(autoFlipInterval);
                isAutoFlipActive = false;
                const btn = document.getElementById('auto-flip-btn');
                if (btn) { btn.style.background = ''; btn.style.color = ''; }
            }
        }

        render(); renderSaved();
    </script>
