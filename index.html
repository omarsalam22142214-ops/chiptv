<!DOCTYPE html>
<html lang="ar" dir="rtl">
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1300">
    <title>Nova Stream - Advanced Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <!-- مانع الإعلانات المطور -->
    <style>
        :is(iframe[src*='ads'], iframe[src*='doubleclick'], .adsbygoogle, [id*='google_ads'], [id*='taboola-'], .taboolaHeight, .taboola-placeholder, #top-ad, [id*='google-one-tap-iframe'], #amp_floatingAdDiv, #ez-content-blocker-container) {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            visibility: hidden !important;
            min-height: 0 !important;
        }
    </style>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #151b2b;
            --bg-hover: #1e263c;
            --accent: #00d2ff;
            --accent-hover: #00a3cc;
            --text-main: #f0f4f8;
            --text-muted: #8b9eb0;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1300px;
            gap: 20px;
        }

        /* لوحة التحكم */
        .controls-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }

        .controls-panel input, .controls-panel textarea {
            flex: 1; min-width: 140px; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.2);
            color: white; outline: none; transition: 0.3s; font-family: inherit;
        }

        .controls-panel textarea { resize: vertical; min-height: 100px; width: 100%; }

        .controls-panel input:focus, .controls-panel textarea:focus { 
            border-color: var(--accent); box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); 
        }

        .action-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

        .btn {
            padding: 12px 18px; border: none; border-radius: 8px; color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            font-size: 14px; display: flex; align-items: center; gap: 6px;
        }

        .btn:active { transform: scale(0.96); }
        .btn-add { background: var(--accent); color: #000; }
        .btn-add:hover { background: var(--accent-hover); }
        .btn-upload { background: var(--success); color: #000;}
        .btn-upload:hover { background: #26b361; }
        .btn-export { background: var(--warning); color: #000;}
        .btn-export:hover { background: #e09200; }
        .btn-clear { background: var(--danger); }
        .btn-clear:hover { background: #e03e4d; }
        .btn-save { background: #2ed573; color: #000; }
        .btn-save:hover { background: #26b361; }
        
        /* أزرار الإضافات */
        .btn-link { background: #3498db; color: #fff; }
        .btn-link:hover { background: #2980b9; }
        .btn-xtream { background: #9b59b6; color: #fff; }
        .btn-xtream:hover { background: #8e44ad; }
        .btn-stalker { background: #e67e22; color: #fff; }
        .btn-stalker:hover { background: #d35400; }
        .btn-quick { background: #f39c12; color: #fff; }
        .btn-quick:hover { background: #e67e22; }
        .btn-scrape { background: #e74c3c; color: #fff; }
        .btn-scrape:hover { background: #c0392b; }
        .btn-bulk { background: #00cec9; color: #000; }
        .btn-bulk:hover { background: #00b8b2; }
        
        #xtream-panel, #link-panel, #stalker-panel, #bulk-panel {
            display: none; 
            margin-top: -10px; 
            background: rgba(30, 38, 60, 0.7); 
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            animation: fadeIn 0.3s ease;
            flex-direction: column;
            align-items: stretch;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* منطقة المشغل والقائمة */
        .content-area { display: flex; gap: 20px; height: calc(100vh - 160px); min-height: 500px; }

        /* القائمة الجانبية */
        .sidebar {
            flex: 1; background: var(--bg-panel); border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); max-width: 420px;
        }

        .sidebar-header {
            padding: 18px; background: rgba(0, 0, 0, 0.2); font-size: 18px;
            font-weight: bold; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            font-size: 12px; background: var(--accent); color: #000;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
        }

        /* تنسيق شريط البحث */
        .search-box {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* تنسيق الفولدرات */
        .main-list-container {
            overflow-y: auto; flex: 1;
        }
        .main-list-container::-webkit-scrollbar { width: 6px; }
        .main-list-container::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .channel-list { list-style: none; padding: 0; margin: 0; }

        .folder-container { border-bottom: 1px solid rgba(255, 255, 255, 0.02); }
        
        .folder-header {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent);
            transition: 0.2s;
        }
        .folder-header:hover { background: rgba(255, 255, 255, 0.06); }
        .folder-header.active { background: rgba(0, 210, 255, 0.1); }
        .folder-icon { transition: transform 0.3s; }
        .folder-header.active .folder-icon { transform: rotate(90deg); }

        .folder-content { display: none; background: rgba(0, 0, 0, 0.15); }
        .folder-content.open { display: block; }

        .channel-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px 10px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.2s; cursor: pointer;
        }

        .channel-item:hover { background: var(--bg-hover); }
        .channel-item.playing { background: rgba(0, 210, 255, 0.15); border-right: 4px solid var(--accent); }

        .channel-info { display: flex; align-items: center; flex: 1; overflow: hidden; }
        .channel-thumb { width: 40px; height: 40px; border-radius: 8px; margin-left: 12px; object-fit: cover; background: #000; }
        .channel-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }

        .channel-actions { display: flex; gap: 5px; align-items: center; }
        
        .btn-delete { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-delete:hover { color: var(--danger); transform: scale(1.1); }
        
        .btn-copy { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-copy:hover { color: var(--success); transform: scale(1.1); }

        /* منطقة الفيديو */
        .video-container {
            flex: 2.5; background: var(--bg-panel); border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .now-playing-title { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .player-actions { display: flex; gap: 10px; }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1); border: none; color: white;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.2); }

        .player-wrapper {
            flex: 1; border-radius: 12px; overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .plyr { width: 100%; height: 100%; --plyr-color-main: var(--accent); }

        .plyr--video {
            display: flex !important;
            flex-direction: column !important;
            background: #0b0f19 !important;
        }
        .plyr__video-wrapper {
            flex: 1 !important;
            height: auto !important;
            background: #000 !important;
        }
        
        .plyr:not(.plyr--fullscreen-active) .plyr__controls {
            order: -1 !important; 
            position: relative !important;
            bottom: auto !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            background: var(--bg-panel) !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
            padding: 10px 15px !important;
            border-bottom: 2px solid var(--accent);
            z-index: 50;
        }
        
        .plyr:not(.plyr--fullscreen-active) .plyr__controls::before { display: none !important; }
        .plyr:not(.plyr--fullscreen-active) .plyr__control--overlaid { display: none !important; }
        .plyr--fullscreen-active { display: block !important; }

        @media (max-width: 992px) {
            .content-area { flex-direction: column-reverse; height: auto; }
            .sidebar { max-width: 100%; height: 400px; }
            .controls-panel { flex-direction: column; align-items: stretch; }
            .action-btns { justify-content: space-between; }
        }

        body.cinema-mode .controls-panel { display: none !important; }
        body.cinema-mode .sidebar { display: none !important; }
        body.cinema-mode .content-area { height: calc(100vh - 40px); }
        body.cinema-mode .video-container { height: 100%; }

    </style>
</head>

    <div class="app-wrapper">
        <div class="controls-panel">
            <div class="input-group">
                <input type="text" id="i-name" placeholder="اسم القناة">
                <input type="text" id="i-url" placeholder="رابط البث (m3u8/ts/xspf)">
                <input type="text" id="i-logo" placeholder="رابط اللوجو (اختياري)">
                <input type="text" id="i-group" placeholder="المجلد (اختياري)">
                <button class="btn btn-add" onclick="addChannel()">➕ إضافة</button>
            </div>
            
            <div class="input-group" style="flex-basis: 100%; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: 5px;">
                <input type="text" id="i-direct-link" placeholder="رابط بث (فيديو) أو موقع للتشغيل المباشر داخل المشغل...">
                <button class="btn btn-add" onclick="playDirectLink()">▶️ تشغيل كفيديو</button>
                <button class="btn btn-link" onclick="playWebsite()">🌐 تشغيل كموقع</button>
                <button class="btn btn-save" onclick="saveCurrentLink()">💾 حفظ في المحفوظات</button>
            </div>
            
            <div class="action-btns" style="flex-basis: 100%;">
                <button class="btn btn-scrape" onclick="scrapeMatch()">🕸️ سحب الماتش</button>
                <button class="btn btn-stalker" onclick="toggleStalkerPanel()">🎮 حساب ستالكر</button>
                <button class="btn btn-link" onclick="toggleLinkPanel()">🌐 استيراد من رابط</button>
                <button class="btn btn-xtream" onclick="toggleXtreamPanel()">📡 حساب اكستريم</button>
                <button class="btn btn-bulk" onclick="toggleBulkPanel()">📝 نصوص متعددة</button>

        // تم تحديث الدالة لاستخراج group-title
        function parseM3U(content) {
            const lines = content.split('\n');
            let result = [];
            let temp = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    let nameMatch = line.match(/,(.+)$/);
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    let groupMatch = line.match(/group-title="([^"]+)"/);
                    
                    temp.name = nameMatch ? nameMatch[1].trim() : 'قناة غير معروفة';
                    temp.logo = logoMatch ? logoMatch[1] : '';
                    temp.group = groupMatch ? groupMatch[1].trim() : 'قنوات عامة';
                } else if (line && !line.startsWith('#')) {
                    temp.url = line;
                    result.push(temp);
                    temp = {}; 
                }
            }
            return result;
        }

        function parseXSPF(content) {
            let result = [];
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(content, "text/xml");
                const tracks = xmlDoc.getElementsByTagName("track");
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    const titleNode = track.getElementsByTagName("title")[0];
                    const locationNode = track.getElementsByTagName("location")[0];
                    const imageNode = track.getElementsByTagName("image")[0];
                    const name = titleNode ? titleNode.textContent.trim() : 'قناة غير معروفة';
                    const url = locationNode ? locationNode.textContent.trim() : '';
                    const logo = imageNode ? imageNode.textContent.trim() : '';
                    if (url) result.push({ name, url, logo, group: 'قنوات عامة' });
                }
            } catch (e) { console.error("XSPF error", e); }
            return result;
        }

        function mergeChannels(newChs) {
            const combinedChannels = newChs.concat(channels);
            const uniqueChannels = [];
            const seenUrls = new Set();
            for (const ch of combinedChannels) {
                if (!seenUrls.has(ch.url)) {
                    seenUrls.add(ch.url);
                    uniqueChannels.push(ch);
                }
            }
            channels = uniqueChannels;
            render();
        }

        function filterChannels() {
            const query = document.getElementById('i-search').value.toLowerCase();
            const folders = document.querySelectorAll('.folder-container');

            folders.forEach(folder => {
                let hasMatch = false;
                const items = folder.querySelectorAll('.channel-item');
                
                items.forEach(item => {
                    const name = item.querySelector('.channel-name').innerText.toLowerCase();
                    if (name.includes(query)) {
                        item.style.display = 'flex';
                        hasMatch = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                folder.style.display = hasMatch ? 'block' : 'none';
                
                const content = folder.querySelector('.folder-content');
                const header = folder.querySelector('.folder-header');
                
                if (query !== '' && hasMatch) {
                    content.classList.add('open');
                    header.classList.add('active');
                } else if (query === '') {
                    content.classList.remove('open');
                    header.classList.remove('active');
                }
            });
        }

            currentUrl = url;
            currentName = name;
            currentChannelIndex = index;
            
            const directLinkInput = document.getElementById('i-direct-link');
            if (directLinkInput) directLinkInput.value = url;
            domTitle.innerText = "⏳ جاري الاتصال...";
            
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
            if (element) element.parentElement.classList.add('playing');

            let streamUrl = url;
            if (streamUrl.includes('action=create_link')) {
                try {
                    let res;
                    try { res = await fetch(streamUrl); } 
                    catch(e) { res = await fetch('https://corsproxy.io/?' + encodeURIComponent(streamUrl)); }
                    const data = await res.json();
                    if (data && data.js && data.js.cmd) streamUrl = data.js.cmd.split(' ').pop(); 
                    else throw new Error("لا يمكن توليد الرابط");
                } catch(e) { domTitle.innerText = "❌ فشل رابط ستالكر"; return; }
            }

            if (streamUrl.includes('.ts')) streamUrl = streamUrl.replace('.ts', '.m3u8');
            else if (!streamUrl.includes('.m3u8') && !streamUrl.includes('action=create_link')) streamUrl += ".m3u8";

            domTitle.innerText = name;
            const videoElement = document.getElementById('video-player');
            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoElement);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => plyrInstance.play().catch(()=>{}));
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        else { hlsInstance.destroy(); domTitle.innerText = "❌ البث متوقف"; }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                plyrInstance.play();
            }
        }

        function reloadStream() {
            if (currentUrl) {
                const playingEl = document.querySelector('.channel-item.playing .channel-info');
                play(currentUrl, currentName, playingEl, currentChannelIndex);
            }
        }

        function stopStream() {
            if (hlsInstance) hlsInstance.destroy();
            const videoElement = document.getElementById('video-player');
            if (videoElement) { videoElement.pause(); videoElement.removeAttribute('src'); videoElement.load(); }
            const iframe = document.getElementById('website-player');
            if(iframe) { iframe.style.display = 'none'; iframe.src = ''; }
            const plyrContainer = document.querySelector('.plyr');
            if(plyrContainer) plyrContainer.style.setProperty('display', 'flex', 'important');
            domTitle.innerText = "لم يتم اختيار قناة";
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('playing'));
            currentUrl = ''; currentChannelIndex = -1;
        }

        function addChannel() {
            const name = iName.value.trim();
            const url = iUrl.value.trim();
            const logo = iLogo.value.trim();
            const group = iGroup.value.trim() || 'قنوات عامة';

            if (!name || !url) return alert("يجب إدخال الاسم والرابط!");
            channels.unshift({ name, url, logo, group });
            render();
            iName.value = ''; iUrl.value = ''; iLogo.value = ''; iGroup.value = '';
        }

        function toggleLinkPanel() {
            const panel = document.getElementById('link-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function fetchFromLink() {
            const urlInput = document.getElementById('l-url').value.trim();
            const btn = document.getElementById('btn-fetch-link');
            if (!urlInput) return alert("الرجاء إدخال الرابط!");

            btn.innerText = "⏳ التحميل..."; btn.disabled = true;
            try {
                let testUrl = urlInput.startsWith('http') ? urlInput : 'http://' + urlInput;
                const urlObj = new URL(testUrl);
                const user = urlObj.searchParams.get('username');
                const pass = urlObj.searchParams.get('password');
                
                if (user && pass && (testUrl.includes('get.php') || testUrl.includes('player_api.php'))) {
                    // سحب اكستريم مباشر
                    const baseUrl = urlObj.origin; 
                    
                    // هنجيب الأقسام الأول
                    const catApi = `${baseUrl}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_categories`;
                    let catData = [];
                    try {
                        let catRes = await fetch(catApi);
                        catData = await catRes.json();
                    } catch(e) {
                        let catRes = await fetch('https://corsproxy.io/?' + encodeURIComponent(catApi));
                        catData = await catRes.json();
                    }
                    const catMap = {};
                    if(catData.length) catData.forEach(c => catMap[c.category_id] = c.category_name);

                    // بعدين القنوات
                    const streamApi = `${baseUrl}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_streams`;
                    let res = await fetch(streamApi).catch(async () => await fetch('https://corsproxy.io/?' + encodeURIComponent(streamApi)));
                    const data = await res.json();
                    
                    if (data && data.length > 0) {
                        const newChannels = data.map(stream => ({
                            name: stream.name || 'قناة غير معروفة',
                            url: `${baseUrl}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${stream.stream_id}.m3u8`,
                            logo: stream.stream_icon || '',
                            group: catMap[stream.category_id] || 'اكستريم عام'
                        }));
                        mergeChannels(newChannels);
                        alert(`تم جلب ${newChannels.length} قناة بالفولدرات بتاعتهم!`);
                        toggleLinkPanel(); document.getElementById('l-url').value = '';
                        return; 
                    }
                }
            } catch (e) {}

            try {
                let response = await fetch(urlInput).catch(async () => await fetch('https://corsproxy.io/?' + encodeURIComponent(urlInput)));
                if (!response || !response.ok) throw new Error('مشكلة في الاتصال');
                const content = await response.text();
                
                let newChs = (content.includes('<playlist') || urlInput.endsWith('.xspf')) ? parseXSPF(content) : parseM3U(content);
                
                if (newChs.length === 0) {
                    if(urlInput.includes('.m3u8') || urlInput.includes('.ts')) {
                        mergeChannels([{ name: 'قناة من الرابط', url: urlInput, logo: '', group: 'قنوات عامة' }]);
                        alert("تم إضافة القناة!"); toggleLinkPanel(); document.getElementById('l-url').value = '';
                    } else alert("الرابط مش شغال!");
                } else {
                    mergeChannels(newChs);
                    alert(`تم استيراد ${newChs.length} قناة بالفولدرات!`);
                    toggleLinkPanel(); document.getElementById('l-url').value = '';
                }
            } catch (error) {
                alert("السيرفر مانع السحب المباشر. هنزل الملف وحضرتك ارفعه من زرار الاستيراد 📁.");
                let safeUrl = urlInput.startsWith('http') ? urlInput : 'http://' + urlInput;
                const a = document.createElement('a'); a.href = safeUrl; a.download = ''; 
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                toggleLinkPanel(); document.getElementById('l-url').value = '';
            } finally { btn.innerText = "📥 جلب"; btn.disabled = false; }
        }

        function toggleXtreamPanel() {
            const panel = document.getElementById('xtream-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }
        
        function extractAndFetchXtream() {
            let quickLink = document.getElementById('x-quick-link').value.trim();
            if (!quickLink) return alert("الصق الرابط أولاً!");
            if (!quickLink.startsWith('http')) quickLink = 'http://' + quickLink;
            try {
                const urlObj = new URL(quickLink);
                const user = urlObj.searchParams.get('username');
                const pass = urlObj.searchParams.get('password');
                if (user && pass) {
                    document.getElementById('x-host').value = urlObj.protocol + '//' + urlObj.hostname;
                    document.getElementById('x-port').value = urlObj.port || ''; 
                    document.getElementById('x-user').value = user;
                    document.getElementById('x-pass').value = pass;
                    document.getElementById('x-quick-link').value = '';
                    fetchXtream();
                } else alert("مفيش يوزر وباسورد في الرابط!");
            } catch (e) { alert("رابط غير صحيح!"); }
        }

        async function fetchXtream() {
            const host = document.getElementById('x-host').value.trim();
            const port = document.getElementById('x-port').value.trim();
            const user = document.getElementById('x-user').value.trim();
            const pass = document.getElementById('x-pass').value.trim();
            const btn = document.getElementById('btn-fetch-xtream');

            if (!host || !user || !pass) return alert("اكمل البيانات!");

            let baseUrl = host.endsWith('/') ? host.slice(0, -1) : host;
            if (!baseUrl.startsWith('http')) baseUrl = 'http://' + baseUrl;
            if (port) baseUrl = `${baseUrl}:${port}`;

            btn.innerText = "⏳ جاري التحميل..."; btn.disabled = true;

            try {
                // جلب الأقسام (المجلدات)
                const catApi = `${baseUrl}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_categories`;
                let catData = [];
                try {
                    let catRes = await fetch(catApi);
                    catData = await catRes.json();
                } catch(e) {
                    let catRes = await fetch('https://corsproxy.io/?' + encodeURIComponent(catApi));
                    catData = await catRes.json();
                }
                const catMap = {};
                if(catData.length) catData.forEach(c => catMap[c.category_id] = c.category_name);

                // جلب القنوات
                const streamApi = `${baseUrl}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_streams`;
                let res = await fetch(streamApi).catch(async () => await fetch('https://corsproxy.io/?' + encodeURIComponent(streamApi)));
                const data = await res.json();

                if (!data || data.length === 0) alert("مفيش قنوات!");
                else {
                    const newChannels = data.map(stream => ({
                        name: stream.name || 'قناة',
                        url: `${baseUrl}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${stream.stream_id}.m3u8`,
                        logo: stream.stream_icon || '',
                        group: catMap[stream.category_id] || 'قنوات اكستريم'
                    }));
                    mergeChannels(newChannels);
                    alert(`عاش! تم جلب ${newChannels.length} قناة متقسمين في فولدرات.`);
                    toggleXtreamPanel(); 
                }
            } catch (error) {
                alert("مشكلة في الاتصال! استخدم إضافة CORS في المتصفح وجرب تاني.");
            } finally { btn.innerText = "📥 جلب القنوات"; btn.disabled = false; }
        }

        function toggleStalkerPanel() {
            const panel = document.getElementById('stalker-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function fetchStalker() {
            const portal = document.getElementById('s-url').value.trim();
            const mac = document.getElementById('s-mac').value.trim();
            const btn = document.getElementById('btn-fetch-stalker');
            if (!portal || !mac) return alert("اكمل البيانات!");

            let baseUrl = portal;
            if (baseUrl.endsWith('/c')) baseUrl = baseUrl.slice(0, -2);
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
            if (!baseUrl.endsWith('/server/load.php')) baseUrl += '/server/load.php';

            btn.innerText = "⏳ التحميل..."; btn.disabled = true;
            try {
                const targetUrl = `${baseUrl}?type=itv&action=get_all_channels`;
                let response = await fetch(targetUrl, { headers: { 'mac': mac } }).catch(async () => 
                    await fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl), { headers: { 'mac': mac } })
                );
                const data = await response.json();
                
                if (data && data.js && data.js.data) {
                    const stalkerChannels = data.js.data.map(ch => {
                        let streamUrl = ch.cmd ? ch.cmd.split(' ').pop() : '';
                        if(!streamUrl.startsWith('http')) streamUrl = `${baseUrl}?type=itv&action=create_link&cmd=${encodeURIComponent(ch.cmd)}&mac=${mac}`;
                        return { name: ch.name || 'قناة', url: streamUrl, logo: ch.logo || '', group: 'قنوات ستالكر' };
                    }).filter(ch => ch.url !== '');
                    mergeChannels(stalkerChannels);
                    alert(`تم جلب ${stalkerChannels.length} قناة!`);
                    toggleStalkerPanel();
                } else alert("البيانات فارغة! تأكد من الماك.");
            } catch (error) { alert("مشكلة في الاتصال (CORS)."); } 
            finally { btn.innerText = "📥 جلب ستالكر"; btn.disabled = false; }
        }

        async function importM3U(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            let allNewChannels = [];
            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const content = evt.target.result;
                        resolve(file.name.endsWith('.xspf') || content.includes('<playlist') ? parseXSPF(content) : parseM3U(content));
                    };
                    reader.readAsText(file);
                });
            });
            const results = await Promise.all(readPromises);
            results.forEach(chs => allNewChannels = allNewChannels.concat(chs));
            mergeChannels(allNewChannels);
            alert(`تم رفع القنوات! الإجمالي دلوقتي ${channels.length} قناة.`);
            e.target.value = ''; 
        }

        function removeCh(idx, e) {
            e.stopPropagation();
            channels.splice(idx, 1);
            if (currentChannelIndex === idx) currentChannelIndex = -1;
            else if (currentChannelIndex > idx) currentChannelIndex--;
            render();
        }

        function clearAll() {
            if (channels.length === 0 && savedItems.length === 0) return;
            if (confirm("هل أنت متأكد من مسح كل حاجة؟")) {
                channels = []; savedItems = [];
                localStorage.removeItem('nova_saved_channels');
                localStorage.removeItem('nova_saved_items');
                render(); renderSaved(); stopStream();
            }
        }

        function exportM3U() {
            if (channels.length === 0) return alert("مفيش قنوات!");
            let m3uContent = "#EXTM3U\n";
            channels.forEach(ch => {
                let logoAttr = ch.logo ? ` tvg-logo="${ch.logo}"` : "";
                let groupAttr = ch.group ? ` group-title="${ch.group}"` : "";
                m3uContent += `#EXTINF:-1${logoAttr}${groupAttr},${ch.name}\n${ch.url}\n`;
            });
            const blob = new Blob([m3uContent], { type: 'application/vnd.apple.mpegurl;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Nova_Stream.m3u8';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function exportHTML() {
            if (channels.length === 0 && savedItems.length === 0) return alert("لا توجد قنوات!");
            const docClone = document.documentElement.cloneNode(true);
            docClone.querySelector('#ch-list').innerHTML = '';
            docClone.querySelector('#saved-list').innerHTML = '';
            docClone.querySelector('#np-title span').innerText = 'لم يتم اختيار قناة';
            docClone.querySelector('#ch-count').innerText = '0';
            docClone.querySelector('#saved-count').innerText = '0';
            
            ['#i-name', '#i-url', '#i-logo', '#i-group', '#i-search', '#x-host', '#x-port', '#x-user', '#x-pass', '#l-url', '#s-url', '#s-mac', '#x-quick-link', '#i-direct-link', '#bulk-input'].forEach(id => {
                const el = docClone.querySelector(id);
                if(el) { if (el.tagName === 'TEXTAREA') el.innerHTML = ''; else el.removeAttribute('value'); }
            });

            ['#xtream-panel', '#link-panel', '#stalker-panel', '#bulk-panel'].forEach(id => {
                const panel = docClone.querySelector(id);
                if(panel) panel.style.display = 'none';
            });

            const wrapper = docClone.querySelector('#player-wrapper');
            wrapper.innerHTML = '<iframe id="website-player" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen style="display:none; width:100%; height:100%; border:none; background:#fff; z-index: 10;"></iframe><video id="video-player" autoplay playsinline preload="auto"></video>';

            let htmlString = docClone.outerHTML;
            htmlString = htmlString.replace(/\/\*\[INJECT_CHANNELS\]\*\/[\s\S]*?\/\*\[\/INJECT_CHANNELS\]\*\//, `/*[INJECT_CHANNELS]*/${JSON.stringify(channels)}/*[/INJECT_CHANNELS]*/`);
            htmlString = htmlString.replace(/\/\*\[INJECT_SAVED\]\*\/[\s\S]*?\/\*\[\/INJECT_SAVED\]\*\//, `/*[INJECT_SAVED]*/${JSON.stringify(savedItems)}/*[/INJECT_SAVED]*/`);

            const finalHtml = `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n${htmlString}\n</html>`;
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Nova_Stream_Player.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function playDirectLink() {
            const url = document.getElementById('i-direct-link').value.trim();
            if(!url) return alert("الرجاء إدخال الرابط أولاً!");
            play(url, "تشغيل مباشر", null, -1);
        }

        function playWebsite() {
            const url = document.getElementById('i-direct-link').value.trim();
            if(!url) return alert("الرجاء إدخال الرابط أولاً!");
            let safeUrl = url.startsWith('http') ? url : 'https://' + url;
            stopStream(); 
            const plyrContainer = document.querySelector('.plyr');
            if(plyrContainer) plyrContainer.style.setProperty('display', 'none', 'important');
            const iframe = document.getElementById('website-player');
            if(iframe) { iframe.style.display = 'block'; iframe.src = safeUrl; }
            domTitle.innerText = "🌐 عرض موقع";
        }

        render();
        renderSaved();

    </script>
